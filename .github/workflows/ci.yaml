name: ci

on:
  # pull_request covers every commit on a branch with an open PR. push is
  # scoped to main/tags only, so that branch's commits aren't built twice —
  # once for pull_request, once for a push the "**" pattern used to also
  # match.
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  # gates runs first: secret-scan and self-hygiene are diff-only checks
  # (no build, no test binary), done in seconds, so a leaked credential or a
  # stale doc fails the run before build-shell/build spend minutes producing
  # a binary from code that's already going to be rejected.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          zero="0000000000000000000000000000000000000000"
          base="${PR_BASE:-$PUSH_BEFORE}"

          # A first push (or a tag push) reports the all-zero SHA. Fall back
          # to the root commit so the whole branch is scanned rather than
          # failing on an unreadable ref.
          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
            echo "no usable base ref for this event; scanning from the root commit $base"
          fi

          # WIDEN, NEVER NARROW. A `push` event's `before` SHA can also be a
          # real-but-orphaned commit: a branch that squashes and force-pushes
          # reports its PREVIOUS tip as `before`, and that tip is no longer an
          # ancestor of anything after the rewrite — `fetch-depth: 0` fetches
          # full history of the CURRENT ref, which never included a discarded
          # line of commits. That is not "a mistake in the command" the way an
          # empty/zero base is (above) — it is a real base ref that genuinely
          # no longer resolves — so the answer is the same widening, done
          # LOUDLY (stderr, not silent) rather than by refusing outright: scan
          # the whole branch from its root instead of trusting a diff against
          # a commit that cannot be read. Widening only ever scans MORE than a
          # valid diff would, never less, so it cannot narrow what gets swept.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            widened=$(git rev-list --max-parents=0 HEAD | tail -1)
            echo "gates: base ref '$base' is unreadable (likely a force-push over it); widening to the root commit $widened instead of refusing" >&2
            base="$widened"
          fi

          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: secret-scan
        run: ./scripts/qa/secret-scan.sh "${{ steps.base.outputs.sha }}"

      - name: self-hygiene
        run: ./scripts/qa/self-hygiene.sh "${{ steps.base.outputs.sha }}"

  # go build/go test run as part of language.NewGo's build in the vorpal
  # pipeline (build-shell/build below) — no separate job repeats them here.
  build-shell:
    needs:
      - gates
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - macos-latest
          - macos-latest-large
          - ubuntu-latest
          - ubuntu-latest-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.2.0
        with:
          registry-backend: s3
          registry-backend-s3-bucket: altf4llc-vorpal-registry
          version: 0.4.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - run: vorpal build 'docket-shell'

      - uses: actions/upload-artifact@v7
        with:
          name: vorpal-lock-${{ runner.arch }}-${{ runner.os }}
          path: Vorpal.lock

  build:
    needs:
      - build-shell
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        artifact:
          - docket
        runner:
          - macos-latest
          - macos-latest-large
          - ubuntu-latest
          - ubuntu-latest-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.2.0
        with:
          registry-backend: s3
          registry-backend-s3-bucket: altf4llc-vorpal-registry
          version: 0.4.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - run: |
          ARTIFACT_PATH=$(vorpal build --path '${{ matrix.artifact }}')/bin/docket
          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> $GITHUB_ENV

      - run: |
          echo "ARCH=$(uname -m | tr '[:upper:]' '[:lower:]' | sed 's/arm64/aarch64/')" >> $GITHUB_ENV
          echo "OS=$(uname -s | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - run: |
          ARCHIVE_NAME="docket-${{ env.ARCH }}-${{ env.OS }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C "$(dirname ${{ env.ARTIFACT_PATH }})" "$(basename ${{ env.ARTIFACT_PATH }})"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: docket-dist-${{ env.ARCH }}-${{ env.OS }}
          path: ${{ env.ARCHIVE_NAME }}

  # Runs the actual vorpal-built artifact (downloaded from build's
  # docket-dist-* upload) rather than a throwaway `go build` binary, so this
  # is a real test of what ships.
  e2e:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docket-dist-x86_64-linux
          path: dist

      - run: |
          tar -xzf dist/docket-x86_64-linux.tar.gz -C dist
          chmod +x dist/docket
          echo "DOCKET_BIN=$(pwd)/dist/docket" >> "$GITHUB_ENV"

      - run: ./scripts/qa.sh "$DOCKET_BIN"

  release:
    if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') }}
    needs:
      - e2e
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          fail-on-cache-miss: true
          merge-multiple: true
          pattern: docket-dist-*
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: dist/*
          name: ${{ github.ref_name }}
          prerelease: true
          tag_name: ${{ github.ref }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
