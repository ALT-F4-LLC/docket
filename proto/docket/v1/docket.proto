  string template = 2;
  string executor = 3;
}

message StepRenderResponse {
  string step = 1;
  string packet = 2;
}

message StepResolveRequest {
  string step = 1;
  string as = 2;
  string note = 3;
  string worktree = 4;
  bool batch = 5;
  bool drop_interposed = 6;
  string authority = 7;
  string authority_ref = 8;
  string token = 9;
}

message StepResolveResponse {
  repeated Step steps = 1;
}

message StepShowRequest {
  repeated string steps = 1;
}

message StepShowResponse {
  repeated Step steps = 1;
}

