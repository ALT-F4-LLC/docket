// step
// ---------------------------------------------------------------------------

message StepAnnotateRequest {
  string step = 1;
  string metadata_json = 2;
  string integrated_sha = 3;
  string token = 4;
}

message StepAnnotateResponse {
  Step step = 1;
}

message StepApproveRequest {
  string step = 1;
  string note = 2;
  string value = 3;
  string authority = 4;
  string authority_ref = 5;
  string token = 6;
}

message StepApproveResponse {
  Step step = 1;
}

message StepArtifactRequest {
  string artifact = 1;
  bool payload = 2;
}

message StepArtifactResponse {
  Artifact artifact = 1;
}

message StepArtifactsRequest {
  string step = 1;
}

// StepArtifactsResponse lists a step's artifacts with bodies and payloads
// left empty.
message StepArtifactsResponse {
  repeated Artifact items = 1;
  int32 total = 2;
  bool truncated = 3;
}

message StepClaimRequest {
  string step = 1;
  string owner = 2;
  optional int64 ttl_ms = 3;
  string metadata_json = 4;
  optional double cost_multiplier = 5;
  // recovery_secret is mandatory: the server rejects a claim whose
  // recovery_secret is empty, stores only its hash, and re-mints the token
  // of a held lease only for a re-claim presenting the same secret.
  string recovery_secret = 6;
  bool render = 7;
  string template = 8;
  string executor = 9;
}

message StepClaimResponse {
  string step = 1;
  string token = 2;
  int64 lease_expires_ms = 3;
  StepContextBundle context = 4;
  string packet = 5;
  string claim_error = 6;
  bool re_minted = 7;
  int32 attempt = 8;
  int32 version = 9;
}

// StepCompleteRequest carries the artifact itself. The client reads
// --artifact-file, --payload-file, and each --gap-file and sends their
// content; worktree stays a path because the engine runs gates in it.
message StepCompleteRequest {
  string step = 1;
  string artifact = 2;
  string payload_json = 3;
  repeated string gaps = 4;
  string worktree = 5;
  string metadata_json = 6;
  string usage_json = 7;
  string token = 8;
}

message StepCompleteResponse {
  Step step = 1;
  // detached is true when the step's gates and routing run after the
  // response, so `step` shows the recorded state rather than the outcome.
  bool detached = 2;
  repeated GateResult failed_gates = 3;
}

message StepContextRequest {
  string step = 1;
  bool live = 2;
  bool meta = 3;
}

message StepContextResponse {
  StepContextBundle context = 1;
}

message StepFailRequest {
  string step = 1;
  string note = 2;
  string metadata_json = 3;
  string token = 4;
}

message StepFailResponse {
  Step step = 1;
}

message StepGatesRequest {
  string step = 1;
  repeated string gate = 2;
  bool full = 3;
}

message StepGatesResponse {
  repeated GateResult items = 1;
  int32 total = 2;
  bool truncated = 3;
}

message StepHeartbeatRequest {
  string step = 1;
  string token = 2;
}

message StepHeartbeatResponse {
  string step = 1;
  int64 lease_expires_ms = 2;
}

message StepHoldRequest {
  string step = 1;
  string reason = 2;
  string authority = 3;
  string authority_ref = 4;
  string token = 5;
}

message StepHoldResponse {
  Step step = 1;
}

message StepListRequest {
  string run = 1;
  string issue = 2;
}

message StepListResponse {
  repeated Step items = 1;
  int32 total = 2;
  bool truncated = 3;
}

message StepReapRequest {
  string step = 1;
  string reason = 2;
  string token = 3;
}

message StepReapResponse {
  Step step = 1;
}

message StepRejectRequest {
  string step = 1;
  string note = 2;
  string authority = 3;
  string authority_ref = 4;
  string token = 5;
}

message StepRejectResponse {
