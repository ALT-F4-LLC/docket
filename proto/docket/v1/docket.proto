// The v1 daemon API. docs/design/connect-api-v1.md records the design: the
// package and version rule, the RPC and message naming scheme, how the
// CLI's JSON envelopes relate to these messages, and the codegen command.
syntax = "proto3";

package docket.v1;

option go_package = "github.com/ALT-F4-LLC/docket/internal/gen/docket/v1;docketv1";

// DocketService serves every store-backed CLI verb as one unary RPC, plus
// Handshake. An RPC name is the verb's command path in PascalCase: each path
// segment, and each hyphen-separated word inside a segment, capitalized and
// concatenated (`issue comment add` is IssueCommentAdd, `dispatch
// backfill-usage` is DispatchBackfillUsage).
service DocketService {
  // Handshake is the one RPC with no CLI verb. A client calls it first to
  // learn the daemon's build and API major before issuing any verb.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  rpc Board(BoardRequest) returns (BoardResponse);

  rpc ConfigGet(ConfigGetRequest) returns (ConfigGetResponse);
  rpc ConfigSet(ConfigSetRequest) returns (ConfigSetResponse);

  rpc DispatchAbandon(DispatchAbandonRequest) returns (DispatchAbandonResponse);
  rpc DispatchBackfillUsage(DispatchBackfillUsageRequest) returns (DispatchBackfillUsageResponse);
  rpc DispatchClose(DispatchCloseRequest) returns (DispatchCloseResponse);
  rpc DispatchExtend(DispatchExtendRequest) returns (DispatchExtendResponse);
  rpc DispatchOpen(DispatchOpenRequest) returns (DispatchOpenResponse);
  rpc DispatchVerify(DispatchVerifyRequest) returns (DispatchVerifyResponse);
  rpc DispatchWaiveTarget(DispatchWaiveTargetRequest) returns (DispatchWaiveTargetResponse);

  rpc DocCommentAdd(DocCommentAddRequest) returns (DocCommentAddResponse);
  rpc DocCommentList(DocCommentListRequest) returns (DocCommentListResponse);
  rpc DocCreate(DocCreateRequest) returns (DocCreateResponse);
  rpc DocDelete(DocDeleteRequest) returns (DocDeleteResponse);
  rpc DocEdit(DocEditRequest) returns (DocEditResponse);
  rpc DocLinkAdd(DocLinkAddRequest) returns (DocLinkAddResponse);
  rpc DocLinkRemove(DocLinkRemoveRequest) returns (DocLinkRemoveResponse);
  rpc DocList(DocListRequest) returns (DocListResponse);
  rpc DocShow(DocShowRequest) returns (DocShowResponse);

  rpc Doctor(DoctorRequest) returns (DoctorResponse);

  rpc EventsList(EventsListRequest) returns (EventsListResponse);
  rpc EventsPrune(EventsPruneRequest) returns (EventsPruneResponse);

  rpc Export(ExportRequest) returns (ExportResponse);

  rpc GateStatus(GateStatusRequest) returns (GateStatusResponse);

  rpc GuardGate(GuardGateRequest) returns (GuardGateResponse);
  rpc GuardRecord(GuardRecordRequest) returns (GuardRecordResponse);
  rpc GuardSpawn(GuardSpawnRequest) returns (GuardSpawnResponse);
  rpc GuardStop(GuardStopRequest) returns (GuardStopResponse);

  rpc Import(ImportRequest) returns (ImportResponse);

  rpc IssueClaim(IssueClaimRequest) returns (IssueClaimResponse);
  rpc IssueClose(IssueCloseRequest) returns (IssueCloseResponse);
  rpc IssueCommentAdd(IssueCommentAddRequest) returns (IssueCommentAddResponse);
  rpc IssueCommentList(IssueCommentListRequest) returns (IssueCommentListResponse);
  rpc IssueCreate(IssueCreateRequest) returns (IssueCreateResponse);
  rpc IssueDelete(IssueDeleteRequest) returns (IssueDeleteResponse);
  rpc IssueEdit(IssueEditRequest) returns (IssueEditResponse);
  rpc IssueFileAdd(IssueFileAddRequest) returns (IssueFileAddResponse);
  rpc IssueFileList(IssueFileListRequest) returns (IssueFileListResponse);
  rpc IssueFileRemove(IssueFileRemoveRequest) returns (IssueFileRemoveResponse);
  rpc IssueGraph(IssueGraphRequest) returns (IssueGraphResponse);
  rpc IssueHeartbeat(IssueHeartbeatRequest) returns (IssueHeartbeatResponse);
  rpc IssueLabelAdd(IssueLabelAddRequest) returns (IssueLabelAddResponse);
  rpc IssueLabelDelete(IssueLabelDeleteRequest) returns (IssueLabelDeleteResponse);
  rpc IssueLabelList(IssueLabelListRequest) returns (IssueLabelListResponse);
  rpc IssueLabelRm(IssueLabelRmRequest) returns (IssueLabelRmResponse);
  rpc IssueLinkAdd(IssueLinkAddRequest) returns (IssueLinkAddResponse);
  rpc IssueLinkList(IssueLinkListRequest) returns (IssueLinkListResponse);
  rpc IssueLinkRemove(IssueLinkRemoveRequest) returns (IssueLinkRemoveResponse);
  rpc IssueList(IssueListRequest) returns (IssueListResponse);
  rpc IssueLog(IssueLogRequest) returns (IssueLogResponse);
  rpc IssueMove(IssueMoveRequest) returns (IssueMoveResponse);
  rpc IssueRelease(IssueReleaseRequest) returns (IssueReleaseResponse);
  rpc IssueReopen(IssueReopenRequest) returns (IssueReopenResponse);
  rpc IssueShow(IssueShowRequest) returns (IssueShowResponse);

  rpc Next(NextRequest) returns (NextResponse);

  rpc PinShow(PinShowRequest) returns (PinShowResponse);

  rpc Plan(PlanRequest) returns (PlanResponse);

  rpc PolicyResolve(PolicyResolveRequest) returns (PolicyResolveResponse);

  rpc ProjectDelete(ProjectDeleteRequest) returns (ProjectDeleteResponse);
  rpc ProjectList(ProjectListRequest) returns (ProjectListResponse);
  rpc ProjectSetPrefix(ProjectSetPrefixRequest) returns (ProjectSetPrefixResponse);

  rpc RegistryAudit(RegistryAuditRequest) returns (RegistryAuditResponse);

  rpc ReportExecutors(ReportExecutorsRequest) returns (ReportExecutorsResponse);

  rpc RunAbandon(RunAbandonRequest) returns (RunAbandonResponse);
  rpc RunActivate(RunActivateRequest) returns (RunActivateResponse);
  rpc RunBudget(RunBudgetRequest) returns (RunBudgetResponse);
  rpc RunConduct(RunConductRequest) returns (RunConductResponse);
  rpc RunFactAdd(RunFactAddRequest) returns (RunFactAddResponse);
  rpc RunIssueAdd(RunIssueAddRequest) returns (RunIssueAddResponse);
  rpc RunIssueRemove(RunIssueRemoveRequest) returns (RunIssueRemoveResponse);
  rpc RunNoteAdd(RunNoteAddRequest) returns (RunNoteAddResponse);
  rpc RunNoteList(RunNoteListRequest) returns (RunNoteListResponse);
  rpc RunPause(RunPauseRequest) returns (RunPauseResponse);
  rpc RunRefreshBody(RunRefreshBodyRequest) returns (RunRefreshBodyResponse);
  rpc RunRefreshFiles(RunRefreshFilesRequest) returns (RunRefreshFilesResponse);
  rpc RunRefreshScope(RunRefreshScopeRequest) returns (RunRefreshScopeResponse);
  rpc RunRepin(RunRepinRequest) returns (RunRepinResponse);
  rpc RunReport(RunReportRequest) returns (RunReportResponse);
  rpc RunResume(RunResumeRequest) returns (RunResumeResponse);
  rpc RunStart(RunStartRequest) returns (RunStartResponse);
  rpc RunStatus(RunStatusRequest) returns (RunStatusResponse);
  rpc RunVerifyPins(RunVerifyPinsRequest) returns (RunVerifyPinsResponse);

  rpc SchemaDeprecate(SchemaDeprecateRequest) returns (SchemaDeprecateResponse);
  rpc SchemaList(SchemaListRequest) returns (SchemaListResponse);
  rpc SchemaRegister(SchemaRegisterRequest) returns (SchemaRegisterResponse);
  rpc SchemaShow(SchemaShowRequest) returns (SchemaShowResponse);

  rpc Stats(StatsRequest) returns (StatsResponse);

  rpc StepAnnotate(StepAnnotateRequest) returns (StepAnnotateResponse);
  rpc StepApprove(StepApproveRequest) returns (StepApproveResponse);
  rpc StepArtifact(StepArtifactRequest) returns (StepArtifactResponse);
  rpc StepArtifacts(StepArtifactsRequest) returns (StepArtifactsResponse);
  rpc StepClaim(StepClaimRequest) returns (StepClaimResponse);
  rpc StepComplete(StepCompleteRequest) returns (StepCompleteResponse);
  rpc StepContext(StepContextRequest) returns (StepContextResponse);
  rpc StepFail(StepFailRequest) returns (StepFailResponse);
  rpc StepGates(StepGatesRequest) returns (StepGatesResponse);
  rpc StepHeartbeat(StepHeartbeatRequest) returns (StepHeartbeatResponse);
  rpc StepHold(StepHoldRequest) returns (StepHoldResponse);
  rpc StepList(StepListRequest) returns (StepListResponse);
  rpc StepReap(StepReapRequest) returns (StepReapResponse);
  rpc StepReject(StepRejectRequest) returns (StepRejectResponse);
  rpc StepRender(StepRenderRequest) returns (StepRenderResponse);
  rpc StepResolve(StepResolveRequest) returns (StepResolveResponse);
  rpc StepShow(StepShowRequest) returns (StepShowResponse);

  rpc VoteBackfillUsage(VoteBackfillUsageRequest) returns (VoteBackfillUsageResponse);
  rpc VoteCast(VoteCastRequest) returns (VoteCastResponse);
  rpc VoteClose(VoteCloseRequest) returns (VoteCloseResponse);
  rpc VoteCommit(VoteCommitRequest) returns (VoteCommitResponse);
  rpc VoteCreate(VoteCreateRequest) returns (VoteCreateResponse);
  rpc VoteLink(VoteLinkRequest) returns (VoteLinkResponse);
  rpc VoteList(VoteListRequest) returns (VoteListResponse);
  rpc VoteResult(VoteResultRequest) returns (VoteResultResponse);
  rpc VoteShow(VoteShowRequest) returns (VoteShowResponse);
  rpc VoteUnlink(VoteUnlinkRequest) returns (VoteUnlinkResponse);

  rpc WorkflowDeprecate(WorkflowDeprecateRequest) returns (WorkflowDeprecateResponse);
  rpc WorkflowLint(WorkflowLintRequest) returns (WorkflowLintResponse);
  rpc WorkflowList(WorkflowListRequest) returns (WorkflowListResponse);
  rpc WorkflowRegister(WorkflowRegisterRequest) returns (WorkflowRegisterResponse);
  rpc WorkflowShow(WorkflowShowRequest) returns (WorkflowShowResponse);
}

// ErrorDetail rides as the first detail of every Connect error the daemon
// returns. `code` is the CLI's error code (GENERAL_ERROR, NOT_FOUND,
// VALIDATION_ERROR, CONFLICT, AUTH_ERROR, STALE_LEASE, TIMEOUT, UNTRUSTED,
// GONE), from which the client derives both the envelope's `code` and the
// process exit status. A failure that still carries a report attaches the
// RPC's own response message as a second detail.
message ErrorDetail {
  string code = 1;
}

// ---------------------------------------------------------------------------
// Shared entities. Field names and scalar forms follow the `data` objects the
// CLI emits under --json=v2, so the client renders either envelope version
// from these messages without consulting the store.
// ---------------------------------------------------------------------------

message Lease {
  string owner = 1;
  int64 expires_ms = 2;
  int32 attempt = 3;
}

// ScopeGlobs distinguishes "no scope declared" (field absent) from "declared
// to touch nothing" (present, empty globs).
message ScopeGlobs {
  repeated string globs = 1;
}

message DocRef {
  string id = 1;
  string type = 2;
  string title = 3;
  string status = 4;
}

message Issue {
  string id = 1;
  string parent_id = 2;
  string title = 3;
  string description = 4;
  string status = 5;
  string priority = 6;
  string kind = 7;
  string assignee = 8;
  repeated string labels = 9;
  repeated string files = 10;
  repeated DocRef docs = 11;
  string created_at = 12;
  string updated_at = 13;
  int32 version = 14;
  Lease lease = 15;
  ScopeGlobs scope = 16;
  string resolution = 17;
  string size = 18;
}

message Comment {
  int32 id = 1;
  string issue_id = 2;
  string body = 3;
  string author = 4;
  string created_at = 5;
}

message Activity {
  int32 id = 1;
  string issue_id = 2;
  string field_changed = 3;
  string old_value = 4;
  string new_value = 5;
  string changed_by = 6;
  string created_at = 7;
}

message Label {
  int32 id = 1;
  string name = 2;
  string color = 3;
  int32 issue_count = 4;
}

message Relation {
  int32 id = 1;
  string source_issue_id = 2;
  string target_issue_id = 3;
  string relation_type = 4;
  string created_at = 5;
}

message Doc {
  string id = 1;
  string type = 2;
  string status = 3;
  string title = 4;
  string body = 5;
  string author = 6;
  string created_at = 7;
  string updated_at = 8;
  repeated DocRevision revisions = 9;
  repeated string linked_issues = 10;
}

message DocRevision {
  int32 id = 1;
  string doc_id = 2;
  int32 revision_number = 3;
  string body = 4;
  string change_kind = 5;
  string author = 6;
  string created_at = 7;
}

message DocComment {
  int32 id = 1;
  string doc_id = 2;
  string body = 3;
  string author = 4;
  string created_at = 5;
}

message Project {
  int32 id = 1;
  string identity = 2;
  string name = 3;
  string prefix = 4;
  int64 created_at_ms = 5;
}

message Run {
  string id = 1;
  string request = 2;
  string status = 3;
  string reason = 4;
  double budget = 5;
  double usage_budget = 6;
  optional int64 activated_at_ms = 7;
  int64 created_at_ms = 8;
  int64 updated_at_ms = 9;
  int32 version = 10;
  string exec_root = 11;
  string branch = 12;
  string commit_sha = 13;
  string hostname = 14;
  repeated string issues = 15;
  repeated StatusCount steps = 16;
}

message StatusCount {
  string status = 1;
  int32 count = 2;
}

message IssueRunDisposition {
  string run_id = 1;
  string disposition = 2;
  string by = 3;
  string reason = 4;
  int64 at_ms = 5;
}

message VoterAssignment {
  string voter = 1;
  string model = 2;
  string effort = 3;
  string variant = 4;
}

// StepRow is one step as `next --run`, a dispatch manifest, and a context
// bundle present it.
message StepRow {
  string step = 1;
  string instance = 2;
  string issue = 3;
  string run = 4;
  string kind = 5;
  string executor = 6;
  string class = 7;
  repeated string labels = 8;
  string size = 9;
  repeated string voters = 10;
  string model = 11;
  string effort = 12;
  string variant = 13;
  repeated VoterAssignment voter_assignments = 14;
  string proposal = 15;
}

// Step is a step at its effective status, as `step show` and `step list`
// present it.
message Step {
  StepRow row = 1;
  string status = 2;
  int32 attempt = 3;
  int32 failed_attempts = 4;
  Lease lease = 5;
  string worktree = 6;
  string integrated_sha = 7;
  string metadata_json = 8;
  double expected_cost = 9;
  double accrued_cost = 10;
  int32 version = 11;
}

message GateResult {
  string gate = 1;
  string command = 2;
  string status = 3;
  int32 exit_code = 4;
  int64 duration_ms = 5;
  string output = 6;
  string target_sha = 7;
  bool pre = 8;
  int64 recorded_at_ms = 9;
}

// Artifact bodies are the producer's text; payload_json is the
// schema-validated payload document, opaque to the transport.
message Artifact {
  string id = 1;
  string step = 2;
  string kind = 3;
  string body = 4;
  string payload_json = 5;
  string schema = 6;
  int64 created_at_ms = 7;
}

message ContextInput {
  string name = 1;
  string kind = 2;
  string artifact = 3;
  string body = 4;
  string payload_json = 5;
}

message ContextPin {
  string path = 1;
  string sha256 = 2;
  string body = 3;
}

message LoopEntry {
  int32 k = 1;
  string routing = 2;
}

// StepContextBundle is a step's context bundle: everything a claimant needs,
// assembled at claim.
message StepContextBundle {
  StepRow step = 1;
  Issue issue = 2;
  repeated ContextInput inputs = 3;
  repeated ContextPin pins = 4;
  LoopEntry loop_entry = 5;
  string metadata_json = 6;
  repeated GateResult pre_gates = 7;
  string target_sha = 8;
  string target_worktree = 9;
  string diff_base = 10;
  string resolution = 11;
}

message Event {
  int64 seq = 1;
  string kind = 2;
  string run = 3;
  string step = 4;
  string issue = 5;
  string payload_json = 6;
  int64 at_ms = 7;
}

message RunNote {
  int32 ordinal = 1;
  string authority = 2;
  string text = 3;
  int64 created_at_ms = 4;
}

message Manifest {
  string id = 1;
  string run = 2;
  string status = 3;
  repeated StepRow rows = 4;
  int64 opened_at_ms = 5;
  int64 closed_at_ms = 6;
}

message PinVerdict {
  string path = 1;
  string pinned_sha256 = 2;
  string current_sha256 = 3;
  string verdict = 4;
}

message Finding {
  string severity = 1;
  string title = 2;
  string file = 3;
  int32 line = 4;
  string detail = 5;
}

message Proposal {
  string id = 1;
  string description = 2;
  string criticality = 3;
  string status = 4;
  int32 required_voters = 5;
  double threshold = 6;
  optional double weighted_score = 7;
  string created_by = 8;
  string created_at = 9;
  string updated_at = 10;
  string rationale = 11;
  repeated string domain_tags = 12;
  repeated string files_changed = 13;
  string final_outcome = 14;
  optional string escalation_reason = 15;
  bool sealed = 16;
  repeated string linked_issues = 17;
  repeated Vote votes = 18;
  int32 version = 19;
}

message Vote {
  int32 id = 1;
  string proposal_id = 2;
  string voter_name = 3;
  string voter_role = 4;
  string verdict = 5;
  double confidence = 6;
  double domain_relevance = 7;
  string findings = 8;
  repeated Finding findings_json = 9;
  string summary = 10;
  string metadata_json = 11;
  string created_at = 12;
}

message Schema {
  string name = 1;
  int32 version = 2;
  string source_path = 3;
  string source_sha256 = 4;
  string body = 5;
  bool builtin = 6;
  bool deprecated = 7;
  int64 created_at_ms = 8;
  int32 row_version = 9;
}

message Workflow {
  string name = 1;
  int32 version = 2;
  string description = 3;
  string source_path = 4;
  string source_sha256 = 5;
  string body = 6;
  bool deprecated = 7;
  int64 created_at_ms = 8;
  int32 row_version = 9;
}

// UsageRow is one measured-usage row a relay backfills for a step or voter.
message UsageRow {
  string step = 1;
  string voter = 2;
  string unit = 3;
  double quantity = 4;
}

// IssueFilter carries the list filters `issue list`, `next`, `plan`, `board`,
// and `export` share.
message IssueFilter {
  repeated string status = 1;
  repeated string priority = 2;
  repeated string label = 3;
  repeated string type = 4;
  repeated string size = 5;
  string assignee = 6;
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

message HandshakeRequest {
  string client_version = 1;
  uint32 api_major = 2;
}

message HandshakeResponse {
  // daemon_version is the daemon's build version string, the value
  // `docket version` prints for the daemon binary.
  string daemon_version = 1;
  string daemon_commit = 2;
  string daemon_build_date = 3;
  uint32 api_major = 4;
  int32 store_schema_version = 5;
  string store_path = 6;
}

// ---------------------------------------------------------------------------
// board, config
// ---------------------------------------------------------------------------

message BoardRequest {
  IssueFilter filter = 1;
  bool expand = 2;
  bool with_body = 3;
}

message BoardColumn {
  string status = 1;
  repeated Issue issues = 2;
}

message BoardResponse {
  repeated BoardColumn columns = 1;
}

message ConfigGetRequest {
  string key = 1;
  bool global = 2;
}

message ConfigValue {
  string key = 1;
  string value = 2;
  string source = 3;
}

message ConfigGetResponse {
  repeated ConfigValue values = 1;
}

message ConfigSetRequest {
  string key = 1;
  string value = 2;
  bool global = 3;
}

message ConfigSetResponse {
  ConfigValue value = 1;
}

// ---------------------------------------------------------------------------
// dispatch
// ---------------------------------------------------------------------------

message DispatchAbandonRequest {
  string run = 1;
  string reason = 2;
  string token = 3;
}

message DispatchAbandonResponse {
  Manifest manifest = 1;
}

message DispatchBackfillUsageRequest {
  string run = 1;
  repeated UsageRow rows = 2;
  string source = 3;
  string on_duplicate = 4;
}

message DispatchBackfillUsageResponse {
  int32 recorded = 1;
  int32 skipped = 2;
}

message DispatchCloseRequest {
  string run = 1;
  bool accept_missing_usage = 2;
  repeated UsageRow backfill_rows = 3;
  string on_duplicate = 4;
  string skip_integration_check = 5;
  string source = 6;
  string token = 7;
}

message DispatchCloseResponse {
  Manifest manifest = 1;
  repeated string missing_usage = 2;
  int32 metadata_merged = 3;
}

message DispatchExtendRequest {
  string run = 1;
}

message DispatchExtendResponse {
  Manifest manifest = 1;
  repeated StepRow added = 2;
}

message DispatchOpenRequest {
  string run = 1;
  int32 limit = 2;
  repeated int64 ack_reap = 3;
}

message DispatchOpenResponse {
  Manifest manifest = 1;
  repeated PinVerdict pin_drift = 2;
  repeated string stale_targets = 3;
}

message DispatchVerifyRequest {
  string run = 1;
}

message RowVerdict {
  string step = 1;
  string verdict = 2;
  StepRow manifest_row = 3;
  StepRow current_row = 4;
}

message DispatchVerifyResponse {
  bool match = 1;
  repeated RowVerdict rows = 2;
}

message DispatchWaiveTargetRequest {
  string run = 1;
  repeated string step = 2;
  string target = 3;
  string note = 4;
  string token = 5;
}

message DispatchWaiveTargetResponse {
  repeated string waived = 1;
}

// ---------------------------------------------------------------------------
// doc
// ---------------------------------------------------------------------------

message DocCommentAddRequest {
  string doc = 1;
  string message = 2;
}

message DocCommentAddResponse {
  DocComment comment = 1;
}

message DocCommentListRequest {
  string doc = 1;
}

message DocCommentListResponse {
  repeated DocComment items = 1;
  int32 total = 2;
  bool truncated = 3;
}

message DocCreateRequest {
  string title = 1;
  string description = 2;
  string type = 3;
  string status = 4;
}

message DocCreateResponse {
  Doc doc = 1;
}

message DocDeleteRequest {
  string doc = 1;
  bool cascade = 2;
  bool force = 3;
}

message DocDeleteResponse {
  string id = 1;
  repeated string unlinked = 2;
}

message DocEditRequest {
  string doc = 1;
  optional string title = 2;
  optional string description = 3;
  optional string type = 4;
  optional string status = 5;
}

message DocEditResponse {
  Doc doc = 1;
}

message DocLinkAddRequest {
  string doc = 1;
  string issue = 2;
}

message DocLinkAddResponse {
  string doc = 1;
  string issue = 2;
}

message DocLinkRemoveRequest {
  string doc = 1;
  string issue = 2;
}

message DocLinkRemoveResponse {
  string doc = 1;
  string issue = 2;
}

message DocListRequest {
  repeated string status = 1;
  repeated string type = 2;
  string author = 3;
  string sort = 4;
  int32 limit = 5;
  bool with_body = 6;
}

message DocListResponse {
  repeated Doc items = 1;
  int32 total = 2;
  bool truncated = 3;
}

message DocShowRequest {
  string doc = 1;
  optional int32 rev = 2;
}

message DocShowResponse {
  Doc doc = 1;
}

// ---------------------------------------------------------------------------
// doctor, events, export, import
// ---------------------------------------------------------------------------

message DoctorRequest {
  string run = 1;
  string source = 2;
}

message DoctorCheck {
  string name = 1;
  string status = 2;
  string detail = 3;
}

message DoctorResponse {
  repeated DoctorCheck checks = 1;
  bool ok = 2;
}

message EventsListRequest {
  int64 since = 1;
  int32 limit = 2;
  string run = 3;
}

message EventsListResponse {
  repeated Event items = 1;
  int64 next_cursor = 2;
  int32 total = 3;
  bool truncated = 4;
}

message EventsPruneRequest {
  int64 before = 1;
  bool dry_run = 2;
}

message EventsPruneResponse {
  int64 pruned = 1;
  int64 retained_min_seq = 2;
}

message ExportRequest {
  string format = 1;
  IssueFilter filter = 2;
}

// ExportResponse carries the rendered export document; the client writes it
// to --file or stdout, so the daemon never writes a client path.
message ExportResponse {
  string format = 1;
  string document = 2;
}

// ImportRequest carries the export document's content. The client reads the
// file it names; the daemon never opens a client path.
message ImportRequest {
  string document = 1;
  bool merge = 2;
  bool replace = 3;
  bool yes = 4;
}

message ImportResponse {
  int32 issues = 1;
  int32 comments = 2;
  int32 labels = 3;
  int32 relations = 4;
  int32 docs = 5;
}

// ---------------------------------------------------------------------------
// gate, guard
// ---------------------------------------------------------------------------

message GateStatusRequest {
  string step = 1;
}

message GateStatusResponse {
  string step = 1;
  string outcome = 2;
  string tally = 3;
  repeated string missing_seats = 4;
}

// GuardDecision is a guard predicate's answer: allow, or deny with the
// reason a hook surfaces.
message GuardDecision {
  bool allow = 1;
  string reason = 2;
}

message GuardGateRequest {
  string step = 1;
  string run = 2;
  bool all_projects = 3;
}

message GuardGateResponse {
  GuardDecision decision = 1;
}

message GuardRecordRequest {
  string run = 1;
  bool all_projects = 2;
}

message GuardRecordResponse {
  GuardDecision decision = 1;
}

message GuardSpawnRequest {
  string run = 1;
  bool active = 2;
  repeated StepRow rows = 3;
  repeated int64 ack_reap = 4;
  string deciding_vote = 5;
  bool usage_join = 6;
  bool all_projects = 7;
}

message GuardSpawnResponse {
  GuardDecision decision = 1;
}

message GuardStopRequest {
  string run = 1;
  bool all_projects = 2;
}

message GuardStopResponse {
  GuardDecision decision = 1;
}

// ---------------------------------------------------------------------------
// issue
// ---------------------------------------------------------------------------

message IssueClaimRequest {
  string issue = 1;
  string owner = 2;
  optional int64 ttl_ms = 3;
  string class = 4;
}

message IssueClaimResponse {
  string issue = 1;
  string token = 2;
  int64 lease_expires_ms = 3;
  int32 attempt = 4;
  int32 version = 5;
}

message IssueCloseRequest {
  string issue = 1;
  // token is required only while a live lease is held on the issue.
  string token = 2;
}

message IssueCloseResponse {
  Issue issue = 1;
}

message IssueCommentAddRequest {
